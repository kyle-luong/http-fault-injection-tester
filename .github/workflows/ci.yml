name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO: pin these actions by immutable commit SHA once the repository has a remote.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: false
      - name: Verify project
        run: ./scripts/verify.sh
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: false
      - name: Race and integration suite
        run: ./scripts/verify-full.sh
